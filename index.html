<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Spotify Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="brand">
            <img src="Image/logo.webp">
            <span>Spotify</span>
        </div>

        <div class="links">
            <a href="#">Home</a>
            <a href="#songs">Music</a>
            <a href="#about">About</a>
        </div>
    </nav>

    <section class="hero">

        <div class="hero-text">

            <small>YOUR MUSIC SPACE</small>

            <h1>
                Music that
                <span>moves you.</span>
            </h1>

            <p>
                Listen to your favourite songs with a
                simple and modern music experience.
            </p>

            <button id="heroPlay">
                ▶ Play Music
            </button>

        </div>

        <div class="hero-image">

            <img
                id="mainImage"
                src="song image/naach-meri-rani.jpg"
            >

        </div>

    </section>

    <section class="music" id="songs">

        <div class="heading">

            <div>
                <small>YOUR COLLECTION</small>
                <h2>Featured Music</h2>
            </div>

            <input
                type="text"
                id="search"
                placeholder="Search..."
            >

        </div>

        <div id="songList"></div>

    </section>

    <section class="about" id="about">

        <img src="Image/sound-8825_256.gif">

        <div>
            <small>NOW PLAYING</small>

            <h2 id="songTitle">
                Naach Meri Rani
            </h2>

            <p id="artist">
                Guru Randhawa
            </p>
        </div>

    </section>

    <div class="player">

        <div class="now">

            <img
                id="playerImage"
                src="song image/naach-meri-rani.jpg"
            >

            <div>
                <b id="playerTitle">
                    Naach Meri Rani
                </b>

                <small id="playerArtist">
                    Guru Randhawa
                </small>
            </div>

        </div>

        <div class="controls">

            <div>

                <button id="prev">
                    ⏮
                </button>

                <button
                    id="play"
                    class="play"
                >
                    ▶
                </button>

                <button id="next">
                    ⏭
                </button>

            </div>

            <div class="progress">

                <span id="current">
                    0:00
                </span>

                <input
                    type="range"
                    id="progress"
                    value="0"
                    min="0"
                    max="100"
                >

                <span id="total">
                    0:00
                </span>

            </div>

        </div>

    </div>

    <audio id="audio"></audio>

    <script src="script.js"></script>

</body>

</html>
